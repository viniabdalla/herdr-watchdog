id = "watchdog"
name = "Watchdog"
version = "0.1.0"
min_herdr_version = "0.9.1"
platforms = ["linux"]
description = "Verified conversation layouts and project monitoring panels"

[[actions]]
id = "open"
title = "Watchdog: choose a layout"
contexts = ["workspace", "pane"]
command = ["python3", "watchdog", "open"]

[[panes]]
id = "picker"
title = "Watchdog: choose layout"
placement = "split"
command = ["python3", "watchdog", "pick"]

[[panes]]
id = "tasks"
title = "Watchdog Tasks"
placement = "split"
command = ["python3", "watchdog", "panel", "tasks"]

[[panes]]
id = "progress"
title = "Watchdog Progress"
placement = "split"
command = ["python3", "watchdog", "panel", "progress"]

[[panes]]
id = "artifacts"
title = "Watchdog Artifacts"
placement = "split"
command = ["python3", "watchdog", "panel", "artifacts"]
